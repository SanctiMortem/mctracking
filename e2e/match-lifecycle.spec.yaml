# E2E — Match Lifecycle (EPIC-02)
# Tool: Maestro (https://maestro.mobile.dev)
# Run: maestro test e2e/match-lifecycle.spec.yaml
#
# Preconditions:
#   - App running on simulator/device with an authenticated user
#   - At least 3 players and 3 distinct decks already created
#   - No deck is currently in an in_progress match
#
# MATCH-009 (EPIC-02)

---
appId: com.aboutagency.mtgtracker

# ─── Scenario 1: Full lifecycle — Setup → Close with winner → Results ──────────

- launchApp:
    clearState: false

# Navigate to Match Setup (SCR-007)
- tapOn: "Nueva partida"

# Select 3 players
- tapOn:
    text: ".*"
    index: 0
    label: "player chip 0"
- tapOn:
    text: ".*"
    index: 1
    label: "player chip 1"
- tapOn:
    text: ".*"
    index: 2
    label: "player chip 2"

# Assign decks to each player (one per player)
# Deck picker rows appear after player selection

# Confirm match creation
- tapOn: "Iniciar partida"

# SCR-008 Match Tracker stub — just verify we landed there
- assertVisible: ".*[Tt]racker.*|.*[Pp]artida.*"

# Navigate to Close Match (SCR-009) — tap the close/end button
- tapOn: "Finalizar"

# Select "Hubo un ganador"
- tapOn: "Hubo un ganador"

# Select the first player as winner
- tapOn:
    index: 0
    childOf: "player-list"

# Select win condition "Combo"
- tapOn: "Combo"

# Confirm
- tapOn: "Confirmar"

# SCR-010 Match Results — verify key elements
- assertVisible: "VICTORIA"
- assertVisible: "Victoria por"
- assertVisible: "Combo"
- assertVisible: "Jugadores"
- assertVisible: "Nueva partida"
- assertVisible: "Inicio"

