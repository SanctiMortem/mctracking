<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Mystic Archive - Commander Tracker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed-variant": "#00497c",
                    "inverse-primary": "#7b5815",
                    "inverse-on-surface": "#3c2e19",
                    "primary-fixed": "#ffdeab",
                    "error-container": "#93000a",
                    "surface-container-low": "#251906",
                    "primary-container": "#c99e55",
                    "background": "#1c1102",
                    "primary": "#eebf73",
                    "surface-container-high": "#352813",
                    "on-primary-fixed": "#281900",
                    "tertiary": "#ffb3ad",
                    "on-error": "#690005",
                    "surface-bright": "#453721",
                    "outline": "#9b8f7f",
                    "on-secondary-container": "#c6deff",
                    "on-tertiary-fixed-variant": "#930013",
                    "surface-container": "#2a1d09",
                    "on-secondary": "#003258",
                    "surface": "#1c1102",
                    "on-primary-fixed-variant": "#5f4100",
                    "surface-container-highest": "#41321d",
                    "secondary-container": "#0164a7",
                    "on-surface": "#f7dfbf",
                    "inverse-surface": "#f7dfbf",
                    "secondary-fixed": "#d1e4ff",
                    "on-background": "#f7dfbf",
                    "surface-dim": "#1c1102",
                    "tertiary-fixed": "#ffdad7",
                    "on-primary-container": "#503600",
                    "tertiary-container": "#ff7e77",
                    "error": "#ffb4ab",
                    "surface-tint": "#eebf73",
                    "on-primary": "#422c00",
                    "primary-fixed-dim": "#eebf73",
                    "secondary": "#9ecaff",
                    "surface-container-lowest": "#160c00",
                    "on-tertiary-container": "#7c000e",
                    "secondary-fixed-dim": "#9ecaff",
                    "tertiary-fixed-dim": "#ffb3ad",
                    "on-error-container": "#ffdad6",
                    "outline-variant": "#4e4538",
                    "on-tertiary": "#68000a",
                    "surface-variant": "#41321d",
                    "on-surface-variant": "#d2c4b3",
                    "on-secondary-fixed": "#001d36",
                    "on-tertiary-fixed": "#410004"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        body {
            background-color: #1c1102;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .quadrant {
            height: 50vh;
            width: 50vw;
            position: relative;
        }
        .upside-down {
            transform: rotate(180deg);
        }
        .glass-panel {
            background: rgba(42, 29, 9, 0.7);
            backdrop-filter: blur(20px);
        }
        .glow-blue { box-shadow: inset 0 0 40px rgba(158, 202, 255, 0.15); }
        .glow-red { box-shadow: inset 0 0 40px rgba(255, 126, 119, 0.15); }
        .glow-green { box-shadow: inset 0 0 40px rgba(123, 88, 21, 0.15); }
        .glow-white { box-shadow: inset 0 0 40px rgba(247, 223, 191, 0.1); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body selection:bg-primary selection:text-on-primary">
<!-- Match Tracker Grid -->
<div class="flex flex-wrap w-screen h-screen">
<!-- Player 1: Top Left (Upside Down, Blue Identity) -->
<div class="quadrant upside-down border-r border-b border-outline-variant/10 glow-blue overflow-hidden flex flex-col items-center justify-center relative p-6">
<div class="absolute top-4 left-4 opacity-30">
<span class="material-symbols-outlined text-secondary text-4xl">water_drop</span>
</div>
<!-- Mana/Poison Counters -->
<div class="flex gap-4 mb-4">
<div class="flex items-center gap-2 bg-surface-container-highest px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-xs text-on-surface-variant">skull</span>
<span class="font-headline font-bold text-on-surface-variant">0</span>
</div>
<div class="flex items-center gap-2 bg-surface-container-highest px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-xs text-on-surface-variant">shield</span>
<span class="font-headline font-bold text-on-surface-variant">0</span>
</div>
</div>
<div class="relative flex items-center justify-center w-full">
<button class="absolute left-0 w-16 h-16 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-4xl">remove</span>
</button>
<div class="text-center">
<span class="block font-headline text-[120px] font-black text-on-surface leading-none tracking-tighter drop-shadow-2xl">40</span>
<span class="font-label text-xs uppercase tracking-[0.2em] text-on-surface-variant/50 font-bold">Player One</span>
</div>
<button class="absolute right-0 w-16 h-16 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-4xl">add</span>
</button>
</div>
</div>
<!-- Player 2: Top Right (Upside Down, Red Identity) -->
<div class="quadrant upside-down border-b border-outline-variant/10 glow-red overflow-hidden flex flex-col items-center justify-center relative p-6">
<div class="absolute top-4 right-4 opacity-30">
<span class="material-symbols-outlined text-tertiary-container text-4xl">local_fire_department</span>
</div>
<div class="flex gap-4 mb-4">
<div class="flex items-center gap-2 bg-surface-container-highest px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-xs text-on-surface-variant">skull</span>
<span class="font-headline font-bold text-on-surface-variant">3</span>
</div>
<div class="flex items-center gap-2 bg-surface-container-highest px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-xs text-on-surface-variant">shield</span>
<span class="font-headline font-bold text-on-surface-variant">2</span>
</div>
</div>
<div class="relative flex items-center justify-center w-full">
<button class="absolute left-0 w-16 h-16 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-4xl">remove</span>
</button>
<div class="text-center">
<span class="block font-headline text-[120px] font-black text-on-surface leading-none tracking-tighter drop-shadow-2xl">32</span>
<span class="font-label text-xs uppercase tracking-[0.2em] text-on-surface-variant/50 font-bold">Player Two</span>
</div>
<button class="absolute right-0 w-16 h-16 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-4xl">add</span>
</button>
</div>
</div>
<!-- Player 3: Bottom Left (Correct Orientation, White Identity) -->
<div class="quadrant border-r border-outline-variant/10 glow-white overflow-hidden flex flex-col items-center justify-center relative p-6">
<div class="absolute bottom-4 left-4 opacity-30">
<span class="material-symbols-outlined text-on-surface text-4xl">light_mode</span>
</div>
<div class="relative flex items-center justify-center w-full mb-4">
<button class="absolute left-0 w-16 h-16 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-4xl">remove</span>
</button>
<div class="text-center">
<span class="block font-headline text-[120px] font-black text-on-surface leading-none tracking-tighter drop-shadow-2xl">48</span>
<span class="font-label text-xs uppercase tracking-[0.2em] text-on-surface-variant/50 font-bold">Player Three</span>
</div>
<button class="absolute right-0 w-16 h-16 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-4xl">add</span>
</button>
</div>
<div class="flex gap-4">
<div class="flex items-center gap-2 bg-surface-container-highest px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-xs text-on-surface-variant">skull</span>
<span class="font-headline font-bold text-on-surface-variant">0</span>
</div>
<div class="flex items-center gap-2 bg-surface-container-highest px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-xs text-on-surface-variant">shield</span>
<span class="font-headline font-bold text-on-surface-variant">0</span>
</div>
</div>
</div>
<!-- Player 4: Bottom Right (Correct Orientation, Green Identity) -->
<div class="quadrant glow-green overflow-hidden flex flex-col items-center justify-center relative p-6">
<div class="absolute bottom-4 right-4 opacity-30">
<span class="material-symbols-outlined text-primary-container text-4xl">forest</span>
</div>
<div class="relative flex items-center justify-center w-full mb-4">
<button class="absolute left-0 w-16 h-16 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-4xl">remove</span>
</button>
<div class="text-center">
<span class="block font-headline text-[120px] font-black text-on-surface leading-none tracking-tighter drop-shadow-2xl">40</span>
<span class="font-label text-xs uppercase tracking-[0.2em] text-on-surface-variant/50 font-bold">Player Four</span>
</div>
<button class="absolute right-0 w-16 h-16 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-4xl">add</span>
</button>
</div>
<div class="flex gap-4">
<div class="flex items-center gap-2 bg-surface-container-highest px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-xs text-on-surface-variant">skull</span>
<span class="font-headline font-bold text-on-surface-variant">1</span>
</div>
<div class="flex items-center gap-2 bg-surface-container-highest px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-xs text-on-surface-variant">shield</span>
<span class="font-headline font-bold text-on-surface-variant">5</span>
</div>
</div>
</div>
</div>
<!-- Central Control Hub -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[60]">
<div class="glass-panel p-2 rounded-full flex items-center gap-2 shadow-[0_0_50px_rgba(0,0,0,1)] border border-outline-variant/20">
<button class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface hover:text-primary hover:bg-surface-bright transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button class="group px-6 h-12 rounded-full bg-gradient-to-tr from-primary to-primary-container flex items-center gap-3 text-on-primary font-headline font-black uppercase tracking-widest hover:shadow-[0_0_20px_rgba(238,191,115,0.4)] transition-all active:scale-95">
<span class="material-symbols-outlined text-xl" data-icon="sports_score">sports_score</span>
<span class="hidden md:block">End Match</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface hover:text-primary hover:bg-surface-bright transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</div>
<!-- Decorative Corner Accents -->
<div class="fixed top-0 left-0 w-24 h-24 bg-gradient-to-br from-primary/5 to-transparent pointer-events-none"></div>
<div class="fixed top-0 right-0 w-24 h-24 bg-gradient-to-bl from-primary/5 to-transparent pointer-events-none"></div>
<div class="fixed bottom-0 left-0 w-24 h-24 bg-gradient-to-tr from-primary/5 to-transparent pointer-events-none"></div>
<div class="fixed bottom-0 right-0 w-24 h-24 bg-gradient-to-tl from-primary/5 to-transparent pointer-events-none"></div>
</body></html>
